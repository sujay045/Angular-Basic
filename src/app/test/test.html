<!-- Data Binding fails in case of boolean values -->
<input type="text" value="{{ uname }}" disabled="{{ flag1 }}"><br><br>

<input type="text" value="{{ uname }}" [disabled]="flag1"><br><br>
<input type="text" value="{{ uname }}" [disabled]="flag2"><br><br>
